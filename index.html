<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <!-- CSP: 原則 自オリジンのみ。RevenueCat Web Billing（決済）のため Stripe / RevenueCat のドメインだけ限定的に許可する。
       inline style を多用しているため style-src には 'unsafe-inline' が必要。
       script-src に js.stripe.com（Stripe.js を実行時に読み込む）、connect/frame に Stripe・RevenueCat を許可。
       決済UIはStripe側のiframe内で完結するため、自オリジンのscript権限は 'self' のまま最小に保つ。 -->
  <!-- frame-ancestors/sandbox/report-uri は meta では無視される（HTTPヘッダー専用）ため指定しない。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.revenuecat.com https://e.revenue.cat https://sdk.revenuecat-static.com https://*.stripe.com https://*.stripe.network; frame-src https://js.stripe.com https://hooks.stripe.com https://*.stripe.com https://*.stripe.network; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff5c8a" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Lumi（ルミ）｜キャスト・アイドルのための給与・シフト管理アプリ</title>
  <meta name="description" content="Lumi（ルミ）はキャスト・アイドルのための給与・シフト管理アプリ。時給や歩合（バック）、日払い、顧客・イベント管理、収支レポートまでスマホひとつで完結。データは端末の中だけに保存、登録不要ですぐ使えます。" />

  <!-- OGP（LINE・SNSなどのリンク共有プレビュー用） -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Lumi" />
  <meta property="og:title" content="Lumi（ルミ）｜キャスト・アイドルのための給与・シフト管理アプリ" />
  <meta property="og:description" content="時給・歩合（バック）・日払い・顧客やイベントの管理、収支レポートまでスマホひとつで。データは端末内だけに保存、登録不要ですぐ使えます。キャスト・アイドルのお金をかんたん管理。" />
  <meta property="og:url" content="https://poka-tools.github.io/lumi-official/" />
  <meta property="og:image" content="https://poka-tools.github.io/lumi-official/assets/ogp.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="632" />
  <meta property="og:image:alt" content="Lumi（ルミ）キャスト・アイドルのお給料管理アプリ" />
  <meta property="og:locale" content="ja_JP" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lumi（ルミ）｜キャスト・アイドルのための給与・シフト管理アプリ" />
  <meta name="twitter:description" content="時給・歩合（バック）・日払い・顧客やイベントの管理、収支レポートまでスマホひとつで。データは端末内だけに保存、登録不要ですぐ使えます。" />
  <meta name="twitter:image" content="https://poka-tools.github.io/lumi-official/assets/ogp.jpg" />
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="splash-inner">
      <img class="splash-logo" src="assets/logo.png" alt="Lumi キャスト・アイドルの給与管理アプリ" />
      <div class="splash-dots"><span></span><span></span><span></span></div>
    </div>
  </div>
  <header id="appbar"></header>
  <main id="screen"></main>
  <nav id="tabbar">
    <button data-tab="home" class="active" aria-label="ホーム">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.2 12 4l8 7.2"/><path d="M6 9.8V20h12V9.8"/><path d="M10 20v-5h4v5"/></svg>
      <span>ホーム</span></button>
    <button data-tab="calendar" aria-label="カレンダー">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/></svg>
      <span>カレンダー</span></button>
    <button data-tab="record" class="fab" aria-label="記録を追加">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button>
    <button data-tab="report" aria-label="収入">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M7 20v-6M12 20V8M17 20v-9"/></svg>
      <span>収入</span></button>
    <button data-tab="goal" aria-label="目標">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r=".9"/></svg>
      <span>目標</span></button>
  </nav>

  <!-- ヘッダー右上のメニューボタンから開く（顧客・履歴・マイページ・設定などの入口） -->
  <div id="drawerBackdrop" class="drawer-backdrop" aria-hidden="true"></div>
  <aside id="drawer" class="drawer" aria-hidden="true" inert>
    <div class="drawer-head">
      <span class="drawer-brand">Lumi<span class="ab-spark">✦</span></span>
      <button class="drawer-close" data-drawer-close aria-label="閉じる"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <nav class="drawer-nav">
      <button class="drawer-item" data-go="customers">顧客・イベント管理</button>
      <button class="drawer-item" data-go="history">収入履歴</button>
      <button class="drawer-item" data-go="mypage">マイページ</button>
      <button class="drawer-item" data-go="settings">設定</button>
      <button class="drawer-item" data-go="help">ヘルプ（よくある質問）</button>
      <button class="drawer-item" data-go="guide">使い方ガイド</button>
      <a class="drawer-item" href="https://forms.gle/Vp7tpfzfBLnd8Zh69" target="_blank" rel="noopener">ご意見・ご感想（アンケート）</a>
    </nav>
  </aside>
  <script type="module" src="js/app.js"></script>
</body>
</html>
